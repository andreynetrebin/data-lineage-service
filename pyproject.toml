[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-service"
version = "0.1.0"
description = "Data Catalog + Data Lineage service (1C -> ClickHouse -> Airflow -> DataLens)"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ch  = ["clickhouse-driver>=0.2.6"]
dl  = ["requests>=2.31", "sqlglot>=20.0"]

[tool.setuptools.packages.find]
include = ["lineage_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]